<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="90" fill="url(#gradient1)" />
  
  <!-- Inner glow -->
  <circle cx="96" cy="96" r="75" fill="url(#gradient2)" opacity="0.3" />
  
  <!-- Chain Link 1 (Left - EVM/Ethereum Blue) -->
  <path d="M42 72 C42 58, 56 48, 72 48 L82 48 C98 48, 108 58, 108 72 L108 88 C108 102, 98 112, 82 112 L72 112 C56 112, 42 102, 42 88 Z" 
        stroke="#60A5FA" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Chain Link 2 (Right - Sui Green) -->
  <path d="M84 80 C84 66, 98 56, 114 56 L124 56 C140 56, 150 66, 150 80 L150 96 C150 110, 140 120, 124 120 L114 120 C98 120, 84 110, 84 96 Z" 
        stroke="#4ADE80" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Connection lines -->
  <path d="M82 80 L114 80" stroke="url(#bridgeGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M82 96 L114 96" stroke="url(#bridgeGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Checkmark -->
  <path d="M70 140 L90 160 L130 120" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="50%" style="stop-color:#312E81"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    
    <radialGradient id="gradient2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#1E1B4B"/>
    </radialGradient>
    
    <linearGradient id="bridgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#4ADE80"/>
    </linearGradient>
  </defs>
</svg>
